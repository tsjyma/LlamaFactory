# Requires transformers==5.18.0. Launch with DOWNSAMPLE_MODE=4x DISABLE_VERSION_CHECK=1.
# Use FORCE_TORCHRUN=1 for distributed training.
model_name_or_path: openbmb/MiniCPM-V-4.7-1B
trust_remote_code: false
flash_attn: sdpa
use_reentrant_gc: false

stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: true
freeze_language_model: false

dataset: mllm_demo
template: minicpm_v_4_7
enable_thinking: false
cutoff_len: 4096
packing: false
preprocessing_num_workers: 8
dataloader_num_workers: 8

output_dir: saves/minicpmv4_7-1b/full/sft
logging_steps: 1
save_steps: 132
save_total_limit: 3
plot_loss: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_steps: 0.05
bf16: true
ddp_find_unused_parameters: true
